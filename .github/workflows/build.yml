# SPDX-License-Identifier: Apache-2.0
# Builds the Windows installer on every push / pull request (downloadable as a
# workflow artifact), and publishes a GitHub release when a tag vX.Y.Z is pushed.
# Free on GitHub-hosted runners for public repositories.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check third-party notices are up to date
        shell: bash
        run: |
          npm run notices
          git diff --quiet -- THIRD_PARTY_NOTICES.md || echo "::warning::THIRD_PARTY_NOTICES.md differs from the installed dependencies, run 'npm run notices' and commit it"

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi

      - name: Build installer
        run: npm run dist

      - name: SHA-256 checksum
        shell: bash
        working-directory: dist
        run: |
          for f in DeskPTT-Setup-*.exe; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
          # Copie à nom fixe : lien permanent releases/latest/download/DeskPTT-Setup.exe
          cp DeskPTT-Setup-*.exe DeskPTT-Setup.exe
          sha256sum DeskPTT-Setup.exe > DeskPTT-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPTT-windows-x64
          path: |
            dist/DeskPTT-Setup-*.exe
            dist/DeskPTT-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/DeskPTT-Setup*.exe dist/DeskPTT-Setup*.exe.sha256 \
            --title "DeskPTT $GITHUB_REF_NAME" \
            --notes "${NOTES:-See CHANGELOG.md}

          **Windows 10/11 x64.** The installer is not code-signed: SmartScreen may warn, click *More info → Run anyway*. Verify the download with the .sha256 file.

          Free software under the Apache License 2.0 — third-party licenses in THIRD_PARTY_NOTICES.md."
